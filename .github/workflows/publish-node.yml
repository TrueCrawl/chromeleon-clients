name: publish-node

# Publishes node/ to npm using Trusted Publishing (OIDC): npm verifies a
# short-lived token GitHub mints for this repository and this workflow file, so
# no NPM_TOKEN is stored here.
#
# ⚠️ npm, unlike PyPI, has no "pending publisher" concept — a trusted publisher
# can only be attached to a package that ALREADY EXISTS. So the very first
# publish of a new package name is necessarily manual, with a token, from a
# workstation. After that: npmjs.com -> the package -> Settings -> Trusted
# Publisher -> this repo + publish-node.yml, and every later release runs here
# with no credential at all.

on:
  workflow_dispatch:
  push:
    tags:
      - "node-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: node
    # OIDC is the whole mechanism; without this npm has nothing to verify.
    permissions:
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/chromeleon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Trusted publishing landed in npm 11.5.1; the npm bundled with setup-node
      # is older, and an older client silently falls back to looking for a token
      # rather than telling you OIDC is unavailable.
      - name: Install an npm that supports OIDC
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - run: npm test

      - name: Tag must match the published version
        if: startsWith(github.ref, 'refs/tags/node-v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#node-v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || {
            echo "tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          }

      # npm versions are immutable: unpublishing is restricted and a version
      # number can never be reused. Fail rather than republish over a re-run.
      #
      # NPM_TOKEN in the `npm` environment is the primary path, matching
      # publish-rust. OIDC stays as the fallback for whenever a Trusted
      # Publisher is attached.
      #
      # We are token-first because OIDC cannot work here by construction until
      # someone attaches a publisher by hand: npm only allows that on a package
      # that ALREADY exists, so the first release could never have used it, and
      # it was evidently never attached afterwards. 0.2.0 (2026-08-11) and 0.3.0
      # both failed with `E404 ... you do not have permission`. See RELEASING.md.
      - name: Choose a credential
        id: cred
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using NPM_TOKEN from the npm environment."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "No NPM_TOKEN set; attempting Trusted Publishing (OIDC)."
          fi

      - name: Publish (OIDC)
        if: steps.cred.outputs.mode == 'oidc'
        run: npm publish --access public --provenance

      - name: Publish (token)
        if: steps.cred.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      # A publish job can go green while nothing reaches the registry. Ask npm.
      - name: Verify the version is actually on npm
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#node-v}"
          for i in $(seq 1 12); do
            if curl -sf "https://registry.npmjs.org/chromeleon/${VERSION}" > /dev/null; then
              echo "chromeleon ${VERSION} is on npm."
              exit 0
            fi
            echo "not visible yet (attempt ${i}/12); waiting..."
            sleep 10
          done
          echo "::error::chromeleon ${VERSION} did NOT reach npm."
          echo "::error::Fix ONE of these, then re-run this job:"
          echo "::error::(a) npmjs.com -> package chromeleon -> Settings -> Trusted Publisher -> repo TrueCrawl/chromeleon-clients, workflow publish-node.yml"
          echo "::error::(b) add an NPM_TOKEN secret (automation token) to this repo's 'npm' environment"
          exit 1
