name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest build
      # The library must import with NO driver installed — that is the whole
      # point of having no runtime dependencies.
      - run: python -c "import chromeleon; assert 'playwright' not in __import__('sys').modules"
      - run: python -m pytest tests -q
      - run: python -m build
