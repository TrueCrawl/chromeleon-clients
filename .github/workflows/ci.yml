name: ci
on: [push, pull_request]

# One job per client. A language is added by adding a job, not by touching the
# others — nothing here is shared at build time.
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest build
      # Must import with NO driver installed — that is the whole point of
      # having no runtime dependencies.
      - run: python -c "import chromeleon; assert 'playwright' not in __import__('sys').modules"
      - run: python -m pytest tests -q
      - run: python -m build

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    strategy:
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # Same promise as the Python job: the package must work with no driver
      # installed. Checked against the PACKED tarball from a directory that is
      # not the source tree, because requiring it in place would resolve to the
      # sources and prove nothing about what users get.
      - name: Packed tarball imports with no driver present
        run: |
          set -euo pipefail
          tgz="$PWD/$(npm pack --silent)"
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm install --silent "$tgz"
          node -e "
            const c = require('chromeleon');
            if (!require.resolve('chromeleon').includes('node_modules')) {
              throw new Error('resolved outside node_modules: ' + require.resolve('chromeleon'));
            }
            if (typeof c.newProxyContext !== 'function') throw new Error('missing newProxyContext');
            if (Object.keys(require.cache).some(k => k.includes('playwright'))) {
              throw new Error('importing the client pulled in playwright');
            }
          "

          # ESM named imports are a SEPARATE guarantee from require(). Node can
          # only name-import from CommonJS when cjs-module-lexer detects the
          # names statically, and it cannot see through member expressions --
          # `module.exports = { launch: adapters.launch }` leaves the default
          # import as the only usable ESM shape. 0.1.0 shipped exactly that,
          # which broke the package's own .mjs example while CJS tests passed.
          node --input-type=module -e "
            import { launch, newProxyContext, LAUNCH_ARGS } from 'chromeleon';
            if (typeof launch !== 'function') throw new Error('ESM: launch missing');
            if (typeof newProxyContext !== 'function') throw new Error('ESM: newProxyContext missing');
            if (!Array.isArray(LAUNCH_ARGS)) throw new Error('ESM: LAUNCH_ARGS missing');
          "
          # Tooling reads dependency manifests; exports must not make that fatal.
          node -e "require('chromeleon/package.json')"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    strategy:
      matrix:
        # stable proves the crate works with the versions a consumer resolves;
        # 1.75 is the declared MSRV, and it only holds with the committed lock —
        # `url` and `async-lock` both ship newer releases that need 1.85, so a
        # fresh resolution on 1.75 fails. That is a documented caveat in the
        # README, and this job is what keeps the number honest rather than
        # aspirational.
        toolchain: ["stable", "1.75.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.toolchain == 'stable' && 'rustfmt, clippy' || '' }}
      - run: cargo build --locked
      - run: cargo test --locked
      # The chromiumoxide adapter is off by default and pulls chromiumoxide's own
      # MSRV (1.85) in with it, so it is a stable-only job — which is also why it
      # is a feature and not a dependency.
      - name: chromiumoxide adapter
        if: matrix.toolchain == 'stable'
        run: cargo test --locked --features chromiumoxide
      - name: Lints
        if: matrix.toolchain == 'stable'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --features chromiumoxide -- -D warnings
      - name: Docs build clean
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked --features chromiumoxide
      # The crate must package and build from the packaged form, and it must do
      # so WITHOUT the repository around it: the conformance corpus lives one
      # directory up and is deliberately not shipped, so a test that read it at
      # build time would break every consumer's `cargo package`.
      - name: Packages cleanly
        if: matrix.toolchain == 'stable'
        run: cargo publish --dry-run --locked

  conformance:
    # The anti-drift job: one corpus, every client, compared in one place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # Fails only on FAIL — a client that stops matching what the corpus
      # recorded. Known divergences print as XFAIL every run, so they cannot
      # quietly become the new normal.
      - run: python3 conformance/check.py
