name: publish-python

# Publishes python/ to PyPI via Trusted Publishing (OIDC). No API token is
# stored anywhere: PyPI verifies a short-lived token minted by GitHub for this
# exact repository + workflow file, so there is no long-lived secret to leak or
# rotate. Renaming this file breaks publishing until the PyPI publisher config
# is updated to match.
#
# One-time setup on PyPI, before the first run:
#   https://pypi.org/manage/account/publishing/  ->  add a *pending* publisher
#     PyPI project name: chromeleon
#     Owner:             TrueCrawl
#     Repository:        chromeleon-clients
#     Workflow name:     publish-python.yml
#     Environment:       pypi
# A pending publisher is what lets the very first upload create (claim) the
# project; after that it becomes a normal publisher.

on:
  workflow_dispatch:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        working-directory: python
        run: python -m build

      - name: Check metadata renders on PyPI
        working-directory: python
        run: python -m twine check --strict dist/*

      # Installs the built WHEEL and imports it from a neutral directory. Doing
      # this inside python/ would import the adjacent source tree instead and
      # prove nothing about the artifact being uploaded.
      - name: Installed wheel imports with no driver present
        run: |
          set -euo pipefail
          python -m pip install python/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import chromeleon, sys; assert 'playwright' not in sys.modules"
          python -c "import chromeleon, pathlib; assert 'site-packages' in str(pathlib.Path(chromeleon.__file__))"
          python -m pip uninstall -y chromeleon

      # A tag says what version it claims to be; the build says what it is.
      # PyPI will not let you correct a wrong version after the fact -- the
      # filename is permanent even if the release is yanked.
      - name: Tag must match the built version
        if: startsWith(github.ref, 'refs/tags/python-v')
        working-directory: python
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#python-v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/chromeleon-(.+)\.tar\.gz|\1|')
          echo "tag=$tag built=$built"
          [ "$tag" = "$built" ] || {
            echo "tag $GITHUB_REF_NAME does not match built version $built" >&2
            exit 1
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Separate job on purpose. id-token: write is what PyPI trusts; keeping it
    # off the build job means the OIDC token is never exposed to arbitrary code
    # running under setuptools or its build dependencies.
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/chromeleon/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist/

      # Trusted Publishing (OIDC) needs no secret and is the right end state,
      # but it only works once a publisher is registered on PyPI. Until then it
      # fails with a claim mismatch that reads like a code error -- which is
      # exactly what happened to 0.2.0 on 2026-08-11 and again to 0.3.0. If a
      # PYPI_API_TOKEN exists in the `pypi` environment, use it instead, so a
      # release is never blocked on a registry console being configured.
      - name: Choose a credential
        id: cred
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using PYPI_API_TOKEN from the pypi environment."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "No PYPI_API_TOKEN set; attempting Trusted Publishing (OIDC)."
          fi

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: steps.cred.outputs.mode == 'oidc'
        with:
          # Uploads are immutable: a version number can never be reused, even
          # after deletion. Fail rather than paper over a re-run.
          skip-existing: false
          print-hash: true

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: steps.cred.outputs.mode == 'token'
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: false
          print-hash: true

      # A publish job can go green while nothing reaches the registry. Both
      # 0.2.0 publish runs failed on 2026-08-11 and it went unnoticed for a
      # month, because nothing ever asked PyPI whether the version was there.
      - name: Verify the version is actually on PyPI
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#python-v}"
          for i in $(seq 1 12); do
            if curl -sf "https://pypi.org/pypi/chromeleon/${VERSION}/json" > /dev/null; then
              echo "chromeleon ${VERSION} is on PyPI."
              exit 0
            fi
            echo "not visible yet (attempt ${i}/12); waiting..."
            sleep 10
          done
          echo "::error::chromeleon ${VERSION} did NOT reach PyPI."
          echo "::error::Fix ONE of these, then re-run this job:"
          echo "::error::(a) register a Trusted Publisher at https://pypi.org/manage/project/chromeleon/settings/publishing/ -- owner TrueCrawl, repo chromeleon-clients, workflow publish-python.yml, environment pypi"
          echo "::error::(b) add a PYPI_API_TOKEN secret to this repo's 'pypi' environment"
          exit 1
